# =============================================================================
# EEG Trajectory Phenotype Pipeline - single source of paths & parameters.
# Paths are resolved relative to THIS file unless absolute.
# =============================================================================

paths:
  # --- Inputs (assumed precomputed) -----------------------------------------
  # Embeddings metadata: one row per segment, columns `group_name`
  # ("ID_YYYY_MM_DD_...") and `dataset_idx`. This is the file consumed by
  # create_data_splits and LongitudinalEEGDataset.
  metadata_csv: /home/won_ju_kim/yhchoi/Leqembi_260716/Embeddings_LaBraM/test_metadata.csv
  # Memory-mapped .npy of segment embeddings, indexed by `dataset_idx`.
  embeddings_npy: /home/won_ju_kim/yhchoi/Leqembi_260716/Embeddings_LaBraM/test_embeddings.npy
  # Clinical/demographic table (NEW - not in the repo metadata). One row per
  # (patient, session_date) with the covariates below. See `clinical` block.
  # Leave as `null` if you don't have it yet: modules 1-3 (through the scree
  # gate) run fine without it; covariates are filled NaN and only module 7
  # (phenotype_stats) needs them.
  clinical_csv: null
  # Preprocessed raw EEG root (module 6, qeeg). One recording per session.
  raw_eeg_dir: /home/won_ju_kim/yhchoi/Leqembi_260716/Preprocessed/Leqembi

  # --- Working / output ------------------------------------------------------
  splits_dir: /home/won_ju_kim/yhchoi/Leqembi_260716/Exp_260720/splits         # create_data_splits writes fold CSVs here
  output_dir: /home/won_ju_kim/yhchoi/Leqembi_260716/Exp_260720/out            # all intermediate + final artifacts

# Where the reused repo modules live relative to run cwd. run_all inserts this
# on sys.path so `from dataset.datasets import ...` resolves. "." = repo root.
repo_root: "/home/won_ju_kim/yhchoi/Leqembi_260716/LILIE"

seed: 42

# -----------------------------------------------------------------------------
# Clinical table schema. Column names in clinical_csv are mapped here so the
# pipeline is agnostic to the source naming. session_date is parsed to a date;
# patient_id must match the integer ID embedded in `group_name`.
# -----------------------------------------------------------------------------
clinical:
  patient_id_col: patient_id
  session_date_col: session_date        # any pandas-parseable date
  mmse_col: MMSE
  age_col: age
  apoe4_col: APOE4                       # 0/1/2 allele count or 0/1 carrier
  aria_col: ARIA                         # 0/1 (or grade)
  # baseline_severity source: "before" = MMSE at the earlier session of the
  # progression; "patient_baseline" = MMSE at the patient's first session.
  baseline_severity_from: before

# -----------------------------------------------------------------------------
# Module 1 - assemble
# -----------------------------------------------------------------------------
assemble:
  num_folds: 5              # subject-wise CV folds (create_data_splits)

# -----------------------------------------------------------------------------
# Module 2 - delta (LILIE temporal-order model -> per-progression delta)
# -----------------------------------------------------------------------------
delta:
  # LILIE pooler. Primary = Delta. In the repo Delta is selected by
  # pool_method "Linear" or "Raw"; "Attentive" -> AttentiveDelta, "NN" -> NNDelta.
  pool_method: Linear             # PRIMARY (Delta)
  sensitivity_pool_methods: [Attentive, NN]   # config-switchable variants
  clf_method: Linear
  input_dim: 256
  embedding_size: 256
  n_draws: 5                      # segment-pair draws per date (augmentation)
  batch_size: 32
  num_workers: 4
  max_epochs: 200
  start_saving_epoch: 20
  accelerator: auto               # cpu / gpu / auto
  devices: 1                      # SINGLE device only - multi-GPU DDP re-launches
                                  # the whole run_all script per process (breaks it)
  device_index: null              # pin a specific GPU: 0 -> cuda:0, 2 -> cuda:2, etc.
                                  # null = default single device. Overrides `devices`.
                                  # CLI --device N overrides this.
  # Per-progression delta: how many before x after segment pairs to aggregate.
  # null = use all available pairs. Median is taken across pairs.
  max_segment_pairs: null
  aggregate: median               # median across segment pairs (per spec)
  bootstrap_ci_n: 1000            # ordering-AUC bootstrap resamples
  # Use out-of-fold models for each progression's delta (a progression's delta
  # comes from a model that did not train on that patient). Respects invariant 1.
  out_of_fold_deltas: true

# -----------------------------------------------------------------------------
# Module 3 - reduce (PCA + go/no-go scree gate)
# -----------------------------------------------------------------------------
reduce:
  zscore: true                    # z-score each embedding dim across progressions
  max_components: null            # null = min(n_progressions, n_dims)
  gate:
    min_components_above_floor: 2 # >=2 signal components -> proceed
    pc1_dominance_threshold: 0.80 # PC1 >= this AND PC2 < noise_floor -> rank-1
    noise_floor: 0.05
    use_broken_stick: true

# -----------------------------------------------------------------------------
# Orchestration
# -----------------------------------------------------------------------------
run:
  # Stop after module 3 so the explained-variance curve can be inspected before
  # committing to clustering. Set false to let the gate itself route 3 -> 4..8.
  stop_at_gate: true

# -----------------------------------------------------------------------------
# Modules 4-8 (scaffolded; parameters pre-declared for when they are enabled)
# -----------------------------------------------------------------------------
cluster:
  algorithms: [kmeans, gmm]       # kmeans primary, gmm sensitivity
  k_range: [2, 6]
  k_selection: [silhouette, gap]  # favor small k; NOT downstream separation

stability:
  n_bootstrap: 1000
  jaccard_flag_below: 0.60
  sensitivity: [pool_method, k_pm1, kmeans_vs_gmm]

qeeg:
  fs: null                        # sampling rate (Hz); null = read from raw
  bands:
    delta: [1, 4]
    theta: [4, 8]
    alpha: [8, 13]
    alpha1: [8, 10]
    alpha2: [10, 13]
    beta1: [13, 20]
    beta2: [20, 30]
    gamma: [30, 45]
  primary_features: [rel_alpha_posterior, rel_theta, slowing_ratio, paf, alpha_wpli]

  # --- Functional connectivity (implemented) --------------------------------
  # Epoching of the (already preprocessed) raw EEG before spectral estimation.
  epoch_len_s: 4.0                # segment length for cross-spectra
  epoch_overlap: 0.5              # fractional overlap
  hdf5_eeg_key: eeg               # dataset name inside each HDF5 group
  # VC-robust connectivity metrics (wpli primary, imcoh sensitivity).
  connectivity_methods: [wpli, imcoh]
  connectivity_bands: [theta, alpha, alpha1, alpha2, beta1]
  # 10-20 channel order of the raw recordings (must match the data).
  channels: [Fp1, Fp2, F3, F4, C3, C4, P3, P4, O1, O2, F7, F8,
             T3, T4, T5, T6, A1, A2, Fz, Cz, Pz, T1, T2]
  # Posterior subset for the confirmatory posterior-alpha connectivity feature.
  posterior_channels: [P3, P4, O1, O2, Pz, T5, T6]
  # Graph-theoretic summaries per (method, band) - exploratory.
  graph_metrics: [mean_strength, global_efficiency, char_path_length,
                  weighted_clustering, modularity]
  # Confirmatory FC feature(s) that enter the primary FDR family.
  fc_primary_features: [wpli_alpha_global, wpli_alpha_posterior]

phenotype_stats:
  model: mixedlm                  # statsmodels mixedlm; GEE as fallback
  covariates: [dt, baseline_severity, APOE4, ARIA, age]
  patient_random_effect: true
  primary_features: [rel_alpha_posterior, rel_theta, slowing_ratio, paf, alpha_wpli]
  fdr_alpha: 0.05
  # Which within-progression aspect of each feature to compare across clusters:
  # "delta" (change), "baseline", or "both".
  contrast: both
  # FC families: confirmatory (enter primary FDR) vs exploratory (flagged).
  fc_confirmatory_features: [wpli_alpha_global_delta, wpli_alpha_posterior_delta]
  fc_exploratory_pattern: "graph_"   # graph-metric columns are exploratory

report:
  fig_dpi: 200
